<!DOCTYPE html>
<html lang="bg">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Уроци за лаптопи</title>
	<link rel="stylesheet" href="../css/site-theme.css?v=1">
	<link rel="stylesheet" href="../css/tutorial-modal.css?v=8">
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="../js/particle-background.js?v=1" defer></script>
	<script src="../js/tutorial-modal.js?v=4" defer></script>
	<script src="../js/tutorial-display.js?v=4" defer></script>
</head>
<body class="site-theme min-h-screen font-sans text-slate-100 antialiased">
	<div id="header-container"></div>

	<main>
		<section class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
			<h1 class="tutorial-page-title mb-7 text-3xl font-bold">Уроци за лаптопи</h1>
			<div class="mb-6 flex justify-end">
				<label class="sr-only" for="tutorial-category-filter">Филтриране по категория</label>
				<select id="tutorial-category-filter" class="tutorial-page-filter rounded-xl border px-3.5 py-2.5 text-sm focus:ring-2 focus:outline-none">
					<option value="All">Всички хардуерни категории</option>
				</select>
			</div>
			<div id="tutorial-list" data-page="laptop" data-type="Hardware" data-device="Laptop" class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3">
				<p class="col-span-full py-12 text-center text-slate-500">Уроците се зареждат...</p>
			</div>
		</section>
	</main>

	<div id="footer-container"></div>

	<script>
		async function loadComponent(elementId, filePath) {
			try {
				const response = await fetch(`${filePath}?cacheBust=${Date.now()}`);
				if (!response.ok) throw new Error(`Request failed: ${response.status}`);
				const container = document.getElementById(elementId);
				container.innerHTML = await response.text();
				container.querySelectorAll('script').forEach(script => {
					const executableScript = document.createElement('script');
					Array.from(script.attributes).forEach(attribute => executableScript.setAttribute(attribute.name, attribute.value));
					executableScript.textContent = script.textContent;
					script.replaceWith(executableScript);
				});
			} catch (error) {
				console.error(`Could not load ${filePath}:`, error);
			}
		}

		loadComponent('header-container', '/Header&Footer/Header.html');
		loadComponent('footer-container', '/Header&Footer/Footer.html');
	</script>
</body>
</html>
