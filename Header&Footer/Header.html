<style>
  body.nav-locked { overflow: hidden; }

  #header-wrapper {
    --header-accent: #b388ff;
    position: relative;
    z-index: 1000;
    background: radial-gradient(circle at 15% 50%, rgba(124, 77, 255, 0.25), transparent 45%),
                radial-gradient(circle at 85% 50%, rgba(179, 136, 255, 0.18), transparent 45%),
                linear-gradient(180deg, #16121f 0%, #0f0b16 100%);
    box-shadow: 0 8px 35px rgba(124, 77, 255, 0.35);
    border-bottom: 1px solid rgba(179, 136, 255, 0.35);
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
  }

  #header-wrapper * { box-sizing: border-box; }

  #header-wrapper::after {
    content: ""; position: absolute; left: 0; bottom: -1px; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, #7c4dff, #b388ff, #e0d4ff, #b388ff, #7c4dff, transparent);
    background-size: 200% 100%; animation: neonSlide 6s linear infinite;
  }
  @keyframes neonSlide { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  #header-wrapper .h-container {
    max-width: 1200px; margin: 0 auto; padding: 14px 28px;
    display: flex !important; align-items: center; justify-content: center;
    position: relative; min-height: 74px;
  }

  #header-wrapper .menu-toggle {
    position: absolute; left: 28px; top: 50%; transform: translateY(-50%);
    z-index: 2147483647; display: grid !important; width: 44px; height: 44px;
    align-content: center; justify-items: center; gap: 5px; padding: 0;
    border: 1px solid rgba(179, 136, 255, 0.55); border-radius: 8px;
    background: rgba(124, 77, 255, 0.12); cursor: pointer; transition: all 0.25s ease;
  }
  #header-wrapper .menu-toggle:hover,
  #header-wrapper .menu-toggle[aria-expanded="true"] {
    background: rgba(124, 77, 255, 0.35); border-color: #b388ff; box-shadow: 0 0 18px rgba(179, 136, 255, 0.8);
  }
  #header-wrapper .menu-toggle span {
    width: 20px; height: 2px; border-radius: 2px; background: var(--header-accent);
    transition: all 0.3s ease; box-shadow: 0 0 6px rgba(179, 136, 255, 0.8);
  }
  #header-wrapper .menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  #header-wrapper .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  #header-wrapper .menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  #header-wrapper .brand {
    font-size: clamp(1.4rem, 2.4vw, 2.4rem) !important; font-weight: 900 !important;
    letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
    background: linear-gradient(90deg, #ffffff 0%, #e0d4ff 20%, #b388ff 45%, #7c4dff 65%, #b388ff 85%, #ffffff 100%);
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent !important;
    text-shadow: 0 0 24px rgba(179, 136, 255, 0.35); animation: brandShine 5s linear infinite;
  }
  @keyframes brandShine { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

  #header-wrapper .nav-backdrop {
    position: fixed; inset: 0; z-index: 1000; background: rgba(5, 3, 10, 0.72);
    backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  #header-wrapper .nav-backdrop.is-open { opacity: 1; pointer-events: auto; }

  #header-wrapper .nav {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 2147483647;
    width: min(340px, 86vw); display: flex !important; flex-direction: column; gap: 4px; padding: 90px 16px 24px;
    background: radial-gradient(circle at 0% 0%, rgba(124, 77, 255, 0.28), transparent 55%), linear-gradient(180deg, #1a1426 0%, #0f0b16 100%);
    border-right: 1px solid rgba(179, 136, 255, 0.45); box-shadow: 12px 0 45px rgba(0, 0, 0, 0.65);
    transform: translateX(-105%); transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    overflow-y: auto; overscroll-behavior: contain;
  }
  #header-wrapper .nav.is-open { transform: translateX(0); }
  #header-wrapper .nav-title { padding: 0 10px 14px; margin-bottom: 6px; border-bottom: 1px solid rgba(179, 136, 255, 0.3); font-size: 12px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: #b388ff !important; text-shadow: 0 0 12px rgba(179, 136, 255, 0.7); }

  #header-wrapper .nav a, #header-wrapper .submenu-toggle {
    display: block !important; width: 100% !important; padding: 13px 14px !important;
    border: 0; border-radius: 8px; background: transparent; color: #e0d4ff !important;
    font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
    text-align: left; text-decoration: none !important; cursor: pointer; transition: all 0.2s ease; position: relative;
  }
  #header-wrapper .nav a:hover, #header-wrapper .submenu-toggle:hover {
    color: #ffffff !important; background: rgba(124, 77, 255, 0.28);
    box-shadow: inset 3px 0 0 #b388ff, inset 0 0 18px rgba(179, 136, 255, 0.25); padding-left: 18px !important;
  }
  #header-wrapper .submenu-toggle { display: flex !important; align-items: center; justify-content: space-between; }
  #header-wrapper .submenu-indicator {
    width: 8px; height: 8px; margin-left: 18px; border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-2px); transition: transform 0.25s ease;
  }
  #header-wrapper .submenu-toggle[aria-expanded="true"] .submenu-indicator { transform: rotate(225deg) translate(-2px, -1px); }

  #header-wrapper .submenu {
    display: grid !important; grid-template-rows: 0fr; margin: 0 4px 2px 4px; padding-left: 12px;
    border-left: 1px solid rgba(179, 136, 255, 0.45); transition: grid-template-rows 0.3s ease; overflow: hidden;
  }
  #header-wrapper .submenu > * { min-height: 0; }
  #header-wrapper .submenu.is-open { grid-template-rows: 1fr; }
  #header-wrapper .submenu a {
    display: block; padding: 10px 14px; border-radius: 6px; font-size: 14px; font-weight: 500;
    color: #c9b8ff !important; opacity: 0; transform: translateY(-4px);
    transition: opacity 0.25s ease 0.05s, transform 0.25s ease 0.05s, background 0.2s ease, color 0.2s ease;
  }
  #header-wrapper .submenu.is-open a { opacity: 1; transform: translateY(0); }
  #header-wrapper .submenu a::before { content: "›"; margin-right: 8px; color: #7c4dff; font-weight: 800; transition: color 0.2s ease; }
  #header-wrapper .submenu a:hover { color: #ffffff !important; background: rgba(124, 77, 255, 0.25); }
  #header-wrapper .submenu a:hover::before { color: #e0d4ff; }

  @media (max-width: 500px) {
    #header-wrapper .h-container { padding: 12px 16px; }
    #header-wrapper .menu-toggle { left: 16px; }
    #header-wrapper .brand { font-size: 1.05rem !important; letter-spacing: 0.05em; }
    #header-wrapper .nav { width: 88vw; padding-top: 84px; }
  }
</style>

<header id="header-wrapper">
  <div class="h-container">
    <button class="menu-toggle" type="button" aria-label="Отвори навигационното меню" aria-expanded="false" aria-controls="main-navigation">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">Hardware Academy X</div>
  </div>

  <div class="nav-backdrop" id="nav-backdrop" hidden></div>

  <nav class="nav" id="main-navigation" aria-label="Основна навигация">
    <div class="nav-title">Навигация</div>
    <a href="/index.html?v=4">Начало</a>
    <a href="/Admin/VideoHub.html">Видео библиотека</a>
    <div class="nav-group">
      <button class="submenu-toggle" type="button" aria-expanded="false" aria-controls="hardware-submenu">
        Хардуер <span class="submenu-indicator" aria-hidden="true"></span>
      </button>
      <div class="submenu" id="hardware-submenu">
        <div>
          <a href="/Pages/html/desktop.html?v=4">Десктоп</a>
          <a href="/Pages/html/laptop.html?v=4">Лаптоп</a>
          <a href="/Pages/html/phone.html?v=4">Телефон</a>
        </div>
      </div>
    </div>
    <div class="nav-group">
      <button class="submenu-toggle" type="button" aria-expanded="false" aria-controls="software-submenu">
        Софтуер <span class="submenu-indicator" aria-hidden="true"></span>
      </button>
      <div class="submenu" id="software-submenu">
        <div>
          <a href="/Pages/html/software.html?category=General&amp;v=4">Общи</a>
          <a href="/Pages/html/software.html?category=Installation&amp;v=4">Инсталация</a>
          <a href="/Pages/html/software.html?category=Testing&amp;v=4">Тестване</a>
          <a href="/Pages/html/software.html?category=Update&amp;v=4">Актуализация</a>
        </div>
      </div>
    </div>
  </nav>

  <script>
    (function () {
      const menuToggle = document.querySelector(".menu-toggle");
      const navigation = document.querySelector(".nav");
      const backdrop = document.getElementById("nav-backdrop");
      const submenuToggles = Array.from(navigation.querySelectorAll(".submenu-toggle"));

      function closeSubmenus() {
        submenuToggles.forEach((toggle) => {
          toggle.setAttribute("aria-expanded", "false");
          document.getElementById(toggle.getAttribute("aria-controls")).classList.remove("is-open");
        });
      }

      function openMenu() {
        menuToggle.setAttribute("aria-expanded", "true");
        menuToggle.setAttribute("aria-label", "Затвори навигационното меню");
        navigation.classList.add("is-open");
        backdrop.hidden = false;
        requestAnimationFrame(() => backdrop.classList.add("is-open"));
        document.body.classList.add("nav-locked");
      }

      function closeMenu(returnFocus) {
        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Отвори навигационното меню");
        navigation.classList.remove("is-open");
        backdrop.classList.remove("is-open");
        document.body.classList.remove("nav-locked");
        closeSubmenus();
        setTimeout(() => { backdrop.hidden = true; }, 300);
        if (returnFocus) menuToggle.focus();
      }

      menuToggle.addEventListener("click", () => {
        const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
        isOpen ? closeMenu(false) : openMenu();
      });

      backdrop.addEventListener("click", () => closeMenu(true));
      submenuToggles.forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const isOpen = toggle.getAttribute("aria-expanded") === "true";
          closeSubmenus();
          toggle.setAttribute("aria-expanded", String(!isOpen));
          document.getElementById(toggle.getAttribute("aria-controls")).classList.toggle("is-open", !isOpen);
        });
      });
      navigation.addEventListener("click", (event) => {
        if (event.target.closest("a")) closeMenu(false);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          const openSubmenuToggle = submenuToggles.find((t) => t.getAttribute("aria-expanded") === "true");
          if (openSubmenuToggle) {
            closeSubmenus(); openSubmenuToggle.focus(); return;
          }
          if (navigation.classList.contains("is-open")) closeMenu(true);
        }
      });
    })();
  </script>
</header>
