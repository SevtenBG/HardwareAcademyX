<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Header</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: transparent;
      }

      .site-header {
        --header-accent: #8da2ff;
        position: relative;
        z-index: 1000;
        background: #242530;
        box-shadow: 0 8px 25px rgba(36, 37, 48, 0.35);
        border-bottom: 1px solid rgba(141, 162, 255, 0.25);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .brand {
        font-size: clamp(1.5rem, 2vw, 2.5rem);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(
          90deg,
          #edf1ff 0%,
          #b9c7ff 18%,
          #8da2ff 35%,
          #aabaff 52%,
          #7f96ff 70%,
          #e5ebff 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 18px rgba(141, 162, 255, 0.22);
      }

      .menu-toggle {
        position: absolute;
        left: 28px;
        z-index: 2147483647 !important;
        display: grid;
        width: 40px;
        height: 40px;
        align-content: center;
        justify-items: center;
        gap: 5px;
        padding: 0;
        border: 1px solid rgba(141, 162, 255, 0.4);
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
      }

      .menu-toggle span {
        width: 18px;
        height: 2px;
        border-radius: 2px;
        background: var(--header-accent);
      }

      .nav {
        display: none;
        position: absolute;
        left: 28px;
        top: 56px;
        z-index: 2147483647 !important;
        width: max-content;
        min-width: 190px;
        flex-direction: column;
        gap: 4px;
        padding: 8px;
        border: 1px solid rgba(141, 162, 255, 0.25);
        border-radius: 5px;
        background: #242530;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      }

      .nav.is-open {
        display: flex;
      }

      .nav a,
      .submenu-toggle {
        display: block;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        background: transparent;
        color: var(--header-accent);
        font: inherit;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .nav a:hover,
      .nav a:focus-visible,
      .submenu-toggle:hover,
      .submenu-toggle:focus-visible {
        color: #dfe6ff;
      }

      .menu-toggle:focus-visible,
      .nav a:focus-visible,
      .submenu-toggle:focus-visible {
        outline: 2px solid var(--header-accent);
        outline-offset: 2px;
      }

      .submenu-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .submenu-indicator {
        width: 7px;
        height: 7px;
        margin-left: 18px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg) translateY(-2px);
        transition: transform 0.2s ease;
      }

      .submenu-toggle[aria-expanded="true"] .submenu-indicator {
        transform: rotate(225deg) translate(-2px, -1px);
      }

      .submenu {
        display: none;
        flex-direction: column;
        margin: 0 0 4px 10px;
        padding-left: 6px;
        border-left: 1px solid rgba(141, 162, 255, 0.4);
      }

      .submenu.is-open {
        display: flex;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="main-navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="nav" id="main-navigation" aria-label="Main navigation">
          <a href="/index.html?v=4">Main Page</a>
          <div class="nav-group">
            <button class="submenu-toggle" type="button" aria-expanded="false" aria-controls="software-submenu">
              Software
              <span class="submenu-indicator" aria-hidden="true"></span>
            </button>
            <div class="submenu" id="software-submenu">
              <a href="/Pages/html/software.html?category=General&amp;v=4">General</a>
              <a href="/Pages/html/software.html?category=Installation&amp;v=4">OS installation</a>
              <a href="/Pages/html/software.html?category=Testing&amp;v=4">Stress Testing</a>
            </div>
          </div>
          <div class="nav-group">
            <button class="submenu-toggle" type="button" aria-expanded="false" aria-controls="hardware-submenu">
              Hardware
              <span class="submenu-indicator" aria-hidden="true"></span>
            </button>
            <div class="submenu" id="hardware-submenu">
              <a href="/Pages/html/desktop.html?v=4">Desktop</a>
              <a href="/Pages/html/laptop.html?v=4">Laptop</a>
              <a href="/Pages/html/phone.html?v=4">Phone</a>
            </div>
          </div>
        </nav>

        <div class="brand">Hardware Academy X</div>
      </div>
    </header>
    <script>
      const menuToggle = document.querySelector(".menu-toggle");
      const navigation = document.querySelector(".nav");
      const submenuToggles = Array.from(navigation.querySelectorAll(".submenu-toggle"));

      function closeSubmenus() {
        submenuToggles.forEach((toggle) => {
          toggle.setAttribute("aria-expanded", "false");
          document.getElementById(toggle.getAttribute("aria-controls")).classList.remove("is-open");
        });
      }

      menuToggle.addEventListener("click", () => {
        const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
        menuToggle.setAttribute("aria-expanded", String(!isOpen));
        menuToggle.setAttribute("aria-label", isOpen ? "Open navigation menu" : "Close navigation menu");
        navigation.classList.toggle("is-open", !isOpen);
        if (isOpen) closeSubmenus();
      });

      submenuToggles.forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const isOpen = toggle.getAttribute("aria-expanded") === "true";
          closeSubmenus();
          toggle.setAttribute("aria-expanded", String(!isOpen));
          document.getElementById(toggle.getAttribute("aria-controls")).classList.toggle("is-open", !isOpen);
        });
      });

      navigation.addEventListener("click", (event) => {
        if (event.target.closest("a")) {
          menuToggle.setAttribute("aria-expanded", "false");
          menuToggle.setAttribute("aria-label", "Open navigation menu");
          navigation.classList.remove("is-open");
          closeSubmenus();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          const openSubmenuToggle = submenuToggles.find((toggle) => toggle.getAttribute("aria-expanded") === "true");
          if (openSubmenuToggle) {
            closeSubmenus();
            openSubmenuToggle.focus();
            return;
          }
          menuToggle.setAttribute("aria-expanded", "false");
          menuToggle.setAttribute("aria-label", "Open navigation menu");
          navigation.classList.remove("is-open");
          menuToggle.focus();
        }
      });
    </script>
  </body>
</html>
